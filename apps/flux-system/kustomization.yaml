apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - flux-install.yaml

patches:
  - target:
      kind: Deployment
      name: kustomize-controller
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --default-service-account=flux-apply
