apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossly
  namespace: crossly
  labels:
    app.kubernetes.io/part-of: crossly
spec:
  interval: 5m
  timeout: 3m
  sourceRef:
    kind: OCIRepository
    name: crossly-ui
  path: ./
  serviceAccountName: flux-apply
  prune: true
  wait: true
  patches:
    - target:
        kind: Ingress
        name: crossly
      patch: |-
        - op: replace
          path: /spec/rules/0/host
          value: crossly.bozov-lab.com
